<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#060a1c">
  <title>ASTROVOYAGERS · Teacher sign-in</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="portal.css">
</head>
<body class="teacher">
  <main class="signin">
    <div class="signin-card">
      <p class="logo">ASTROVOYAGERS</p>
      <p class="eyebrow">Teacher sign-in</p>
      <h1 id="tTitle">Type your teacher code</h1>
      <p class="muted" id="tSub">The code goes to the board you scanned, locked for that board only. Nobody in the class sees it.</p>
      <div class="pin-dots" id="dots" aria-live="polite"></div>
      <div class="pinpad" id="pad"></div>
      <p class="msg" id="tMsg" role="status"></p>
    </div>
  </main>
  <script src="shared/portalkit.js"></script>
  <script src="teacher.js"></script>
</body>
</html>
